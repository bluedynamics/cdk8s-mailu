worker_processes 2;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

mail {
    server_name mail.example.com;
    auth_http http://admin.mailu-test.svc.cluster.local:8080/internal/auth/email;
    proxy_pass_error_message on;
    set_real_ip_from 10.42.0.0/16;

    smtp_capabilities PIPELINING "SIZE 52428800" ETRN ENHANCEDSTATUSCODES 8BITMIME DSN;

    server {
        listen 10465 proxy_protocol;
        protocol smtp;
        smtp_auth plain;
        auth_http_header Auth-Port 465;
        auth_http_header Client-Port $remote_port;
    }
    server {
        listen 10993 proxy_protocol;
        protocol imap;
        imap_auth plain;
        auth_http_header Auth-Port 993;
        auth_http_header Client-Port $remote_port;
    }
    server {
        listen 10995 proxy_protocol;
        protocol pop3;
        pop3_auth plain;
        auth_http_header Auth-Port 995;
        auth_http_header Client-Port $remote_port;
    }
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        location = /health {
            return 204;
        }
    }
}
