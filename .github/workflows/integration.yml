# Written by hand. projen does not manage this file and leaves it alone.
#
# Runs the nginx configuration of the front against a Mailu built from the
# original images: test/integration/run.sh.

name: integration
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  # The job name is the name of the check on a pull request
  front-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      FRONT_TEST_LOG_DIR: ${{ github.workspace }}/front-test-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Front against a real Mailu
        run: bash test/integration/run.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: front-test-logs
          path: front-test-logs
